<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/2416501087.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>

  <header>
    <h1>Etkinlik Ekle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html" aria-current="page">Ekle</a>
    </nav>
  </header>

  <main>
    <p id="form-aciklama">Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez; sonuç aşağıda gösterilir.</p>

    <form id="etkinlik-formu" action="#" method="post" novalidate>
      <label for="ad">Etkinlik Adı *</label>
      <input type="text" id="ad" name="ad">
      <span id="ad-hata"></span>

      <label for="kategori">Kategori *</label>
      <select id="kategori" name="kategori">
        <option value="">Seçiniz</option>
        <option value="Seminer">Seminer</option>
        <option value="Atölye">Atölye</option>
        <option value="Söyleşi">Söyleşi</option>
      </select>
      <span id="kategori-hata"></span>

      <label for="tarih">Tarih *</label>
      <input type="date" id="tarih" name="tarih">
      <span id="tarih-hata"></span>

      <label for="saat">Saat *</label>
      <input type="time" id="saat" name="saat">
      <span id="saat-hata"></span>

      <label for="yer">Yer *</label>
      <input type="text" id="yer" name="yer" placeholder="Örn. A Blok Konferans Salonu">
      <span id="yer-hata"></span>

      <label for="kontenjan">Kontenjan</label>
      <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000">
      <span id="kontenjan-hata"></span>

      <label for="aciklama">Açıklama</label>
      <textarea id="aciklama" name="aciklama" rows="3"></textarea>
      <span id="aciklama-hata"></span>

      <button type="submit">Kaydet</button>
    </form>
    <div id="form-mesaj"></div>
  </main>

  <footer>
    <p>Hayrunnisa Altınkaya · 2416501087 · 2026</p>
  </footer>

</body>
</html>
